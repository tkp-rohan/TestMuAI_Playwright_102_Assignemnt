
version: 0.1

# Node.js runtime
runtime:
  - language: node
    version: "20"

globalTimeout: 45
testSuiteTimeout: 30
testSuiteStep: 30

# Run on Windows and Linux
runson: ${matrix.os}
matrixEnvPrefix: true

matrix:
  os: [win, linux]
  browser: [Chrome]

concurrency: 2
combineTasksInMatrixMode: true
retryOnFailure: false

# Dashboard Secrets and environment variables
env:
  LT_USERNAME: ${{.secrets.LT_USERNAME}}
  LT_ACCESS_KEY: ${{.secrets.LT_ACCESS_KEY}}
  TEST_MODE: "cloud"
  TEST_MESSAGE: "Welcome to TestMu AI"
  FORM_EMAIL: "qa.assignment@example.com"
  HE_BUILD_NAME: "Playwright 102 Assignment"

# Dependency caching
cacheKey: '{{ checksum "package-lock.json" }}'
cacheDirectories:
  - node_modules

# Pre-execution steps
pre:
  - npm ci
  - npx playwright install chromium
  - node -e "['artifacts/logs', 'test-results', 'playwright-report'].forEach(p => require('fs').mkdirSync(p, { recursive: true }))"

# Execute Playwright tests
testSuites:
  - npx playwright test

# Merge artifacts from parallel tasks
mergeArtifacts: true
stripParentDirectory: true

# Upload reports and logs
uploadArtefacts:
  - name: Playwright Reports
    path:
      - playwright-report/**
      - test-results/**

  - name: Execution Logs
    path:
      - artifacts/logs/**

# Post-execution step
post:
  - echo "Playwright 102 execution finished."
