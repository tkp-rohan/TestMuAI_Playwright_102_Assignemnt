version: 0.1
globalTimeout: 45
testSuiteTimeout: 30
testSuiteStep: 30

runson: ${matrix.os}
matrixEnvPrefix: true
matrix:
  os: [win, linux]
  browser: [Chrome]

concurrency: 2
combineTasksInMatrixMode: true
retryOnFailure: false

# Credentials are resolved only through HyperExecute Dashboard Secrets.
env:
  LT_USERNAME: ${{.secrets.LT_USERNAME}}
  LT_ACCESS_KEY: ${{.secrets.LT_ACCESS_KEY}}
  TEST_MODE: "cloud"
  TEST_MESSAGE: "Welcome to TestMu AI"
  FORM_EMAIL: "qa.assignment@example.com"
  HE_BUILD_NAME: "Playwright 102 Assignment"

cacheKey: '{{ checksum "package-lock.json" }}'
cacheDirectories:
  - node_modules

pre:
  - npm ci
  - npx playwright install chromium
  - mkdir -p artifacts/logs test-results playwright-report

testSuites:
  - npx playwright test

mergeArtifacts: true
stripParentDirectory: true
uploadArtefacts:
  - name: Playwright Reports
    path:
      - playwright-report/**
      - test-results/**
  - name: Execution Logs
    path:
      - artifacts/logs/**

post:
  - echo "Playwright 102 execution finished."

report: true
