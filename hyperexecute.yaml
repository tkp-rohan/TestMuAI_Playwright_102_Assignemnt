
version: 0.1

runtime:
  - language: node
    version: "20"

globalTimeout: 45
testSuiteTimeout: 30
testSuiteStep: 30

runson: ${matrix.os}

project:
  id: "01M6HFK619ZSX4GC32WZPKVJMS"
matrixEnvPrefix: true

matrix:
  os: [win, linux]
  browser: [Chrome]

concurrency: 2
combineTasksInMatrixMode: true
retryOnFailure: false

# Dashboard Secrets and environment variables
env:
  LT_USERNAME: ${{.secrets.LT_USERNAME}}
  LT_ACCESS_KEY: ${{.secrets.LT_ACCESS_KEY}}
  TEST_MODE: "cloud"
  TEST_MESSAGE: "Welcome to TestMu AI"
  FORM_EMAIL: "qa.assignment@example.com"
  HE_BUILD_NAME: "Playwright 102 Assignment"

# Dependency caching
cacheKey: '{{ checksum "package-lock.json" }}'
cacheDirectories:
  - node_modules

# Pre-execution steps
pre:
  - npm ci

# Execute tests
testSuites:
  - npx playwright test

# Generate Playwright HTML report
report: true
partialReports:
  frameworkName: playwright
  location: playwright-report
  type: html

# Artifact management
mergeArtifacts: true
stripParentDirectory: true

uploadArtifacts:
  - name: Playwright Reports
    path:
      - playwright-report/**
      - test-results/**

# Post execution
post:
  - echo "Playwright 102 execution finished."
