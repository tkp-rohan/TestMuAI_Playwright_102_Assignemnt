name: Playwright 102 - HyperExecute

on:
  workflow_dispatch:

jobs:
  hyperexecute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download HyperExecute CLI
        run: |
          curl -fsSL https://downloads.lambdatest.com/hyperexecute/linux/hyperexecute -o hyperexecute
          chmod +x hyperexecute

      - name: Trigger HyperExecute
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
        run: ./hyperexecute --config hyperexecute.yaml --download-artifacts --verbose

      - name: Upload HyperExecute artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hyperexecute-artifacts
          path: artifacts/**
          if-no-files-found: ignore
